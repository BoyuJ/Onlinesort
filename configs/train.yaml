# Public training template for the final Onlinesort configuration.
# Fill data.mearec_h5_paths with your own MEArec H5 files before training.

seed: 42

train:
  device: auto
  log_file: data/logs/onlinesort_train.log
  save: checkpoints/onlinesort_train.pt
  checkpoint_dir: data/checkpoints/onlinesort_train
  checkpoint_every_epochs: 25
  auto_resume: false
  resume_from: ''
  batch_size: 512
  batch_size_tasks: 2
  gate_batch_size: 512
  lr: 0.0007
  weight_decay: 0.0001
  log_every_steps: 0
  scheduler:
    type: warmup_cosine
    warmup_epochs: 2
    min_lr: 5.0e-06
  gate:
    sampler_mode: natural
    loss_type: bce
    loss_weight_mode: none
    use_global_pos_weight: false
    log_source_metrics: true
  contrastive_views:
    enabled: true
    noise_std: 0.01
    gain_jitter: 0.05
  validation:
    enabled: true
    split_mode: recording_holdout
    split_ratio: 0.1
    val_recording_ratio: 0.2
    min_val_recordings: 1
    min_train_recordings: 1
    min_holdout_units: 2
    min_per_class: 1
    min_val_samples_per_unit: 2
    every_epochs: 1
    max_eval_samples: 60000
    pair_samples: 20000
    batch_size: 2048
    seed: 43
    gate_fixed_threshold: 0.5
    gate_goal_spike_recall: 0.94
    gate_goal_noise_accuracy: 0.90
    gate_target_recall_encode: 0.95
    gate_target_recall_assignment_min: 0.90
    gate_warmup_epochs: 3
    gate_patience: 3
    gate_min_f1_gain: 0.05
    cluster:
      enabled: true
      min_samples_per_unit: 8
      max_samples_per_unit: 0
      max_samples_per_recording: 60000
  stage1_gate:
    epochs: 20
    steps_per_epoch: 800
    selection_mode: fixed_0_5_acceptance
    acceptance_min_precision: 0.99
    acceptance_min_recall: 0.90
    encoder_aux:
      enabled: false
  stage2_encoder:
    epochs: 60
    source_mode: matched_positives
    freeze_scope: gate_net_only
    data_filter: frozen_encode_gate
    min_domains_per_unit: 1
    min_samples_per_unit_after_gate: 16
    domain_sampling: round_robin
    use_encode_gate: false
    select_metric_primary: val_lsm10_operational_gt
    select_metric_secondary: val_ber002_operational_gt
    select_metric_tertiary: val_local_silhouette10_operational_gt
    reset_optimizer_on_entry: true
    reset_scheduler_warmup_epochs: 2

model:
  embed_dim: 128
  hidden_dim: 128
  encoder_route: multi_channel_spatial
  footprint_stats_dim: 4
  shared_stem_layers: 2
  gate_stem_layers: 2
  gate_hidden_dim: 64
  gate_n_blocks: 1
  gate_shared_backbone: false
  gate_use_deep: false
  gate_init_bias: 0.0
  encode_gate_thresh: 0.5
  assignment_gate_thresh: 0.5
  fixed_gate_threshold: 0.5
  gate_pos_weight_scale: 1.0
  gate_spatial_dim: 5

data:
  # Example:
  # mearec_h5_paths:
  #   - /path/to/train_input_a.h5
  #   - /path/to/train_input_b.h5
  mearec_h5_paths: []
  patches: data/cache/onlinesort_train_patches.npy
  labels: data/cache/onlinesort_train_labels.npz
  top_k_channels: 9
  normalization_mode: peak_channel_sigma
  peak_only: false
  electrode_config: configs/electrodes/neuronexus32_mearec.yaml
  car_mode: auto
  detector_chunk_sec: 0.5
  strict_overlap_ms: 0.5
  strict_overlap_um: 60.0
  uid_consistency_preflight_enabled: false
  detector:
    alpha: 4.0
    refractory_ms: 0.30
    merge_dt_ms: 0.20
    merge_enabled: true
    merge_mode: neighbors
    merge_radius_ch: 1
    method: fast_local
    stats_update_every_windows: 4
    stats_subsample_step: 8
    active_halo_ms: 0.25
    neighbor_source: config
    max_simul_firing: 0.5
    thr_max_amp_norm: 300.0
    saturation_filter_mode: flag
    low_spatial_score: 0.1
    low_amp_norm: 5.0
    duplicate_dt_ms: 0.45
    duplicate_radius_ch: 1
    hard_min_spatial_score: 0.0
    hard_min_support: 1
    hard_filter_mode: soft

stage2:
  enabled: true
  allowed_sources:
    - primary_matched_positive
    - secondary_matched_positive
  gate_threshold: 0.5
  local_proto_hold_epochs: 0
  local_proto_ramp_epochs: 0
  episode:
    enabled: true
    batch_size_tasks: 2
    max_spikes_per_task: 512
    n_time_blocks: 6
    causal_stress_fraction: 0.25
    min_way: 2
  losses:
    local_proto_nce:
      enabled: true
      weight: 1.0
      max_proto_per_cluster: 1
      top_pos: 1
      hard_neg: 16
      tau: 0.08
      delta: 0.08
    temporal_connection:
      enabled: true
      weight: 0.2
      tau_conn: 0.20
      max_pairs_per_recording: 128
    boundary:
      enabled: false
      weight: 0.0
  filtering:
    require_gate_pass: true
    exclude_strict_overlap: true
    require_qc_pass: true
    exclude_ambiguous: true
  qc:
    min_snr_peak: 3.0
    min_amp_norm: 3.0
    min_spatial_score: 0.0
    max_simul_local: 1
    max_simul_global: 5

loss:
  lambda_gate: 1.0

online:
  clustering:
    candidate_hop: 2
    candidate_max_units: 48
    local_vote_k: 8
    local_vote_weight: 0.15
    neighbor_entropy_thresh: 1.25
    confidence_reject_min: 0.05
    accept_thresh: 0.65
    margin_thresh: 0.05
    update_conf_min: 0.70
